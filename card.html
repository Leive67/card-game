<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Draw Card</title>
  <style>
    :root {
      --bg-start: #f3f5ff;
      --bg-end: #ecf7ff;
      --panel: rgba(255, 255, 255, 0.75);
      --card-back-1: #4338ca;
      --card-back-2: #312e81;
      --shadow: rgba(48, 56, 127, 0.2);
      --ink: #1d2440;
      --muted: #63749a;
      --accent: #6d5ef6;
      --button-shadow: rgba(109, 94, 246, 0.26);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    }

    .game {
      width: min(100%, 520px);
      padding: 32px 24px 24px;
      text-align: center;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 24px 80px var(--shadow);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 2.9rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1rem;
    }

    .table {
      position: relative;
      height: 360px;
      margin-bottom: 20px;
      display: grid;
      place-items: center;
    }

    .deck {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
      z-index: 1;
    }

    .deck:hover,
    .deck:focus-visible {
      transform: translateY(-2px);
      filter: drop-shadow(0 14px 18px rgba(57, 70, 146, 0.18));
      outline: none;
    }

    .deck.is-drawn {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(-30px) scale(0.96);
    }

    .deck-stack {
      position: relative;
      width: 230px;
      height: 290px;
      transform: rotate(-6deg);
    }

    .deck-card {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.25);
      background: linear-gradient(135deg, var(--card-back-1), var(--card-back-2));
      box-shadow: 0 18px 28px rgba(28, 33, 74, 0.18);
    }

    .deck-card:nth-child(1) {
      transform: translate(14px, 12px) rotate(8deg);
      opacity: 0.75;
    }

    .deck-card:nth-child(2) {
      transform: translate(8px, 8px) rotate(4deg);
      opacity: 0.9;
    }

    .deck-card:nth-child(3) {
      display: grid;
      place-items: center;
      overflow: hidden;
      background-image:
        linear-gradient(135deg, rgba(255,255,255,0.08), transparent),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.16), transparent 20%),
        linear-gradient(135deg, var(--card-back-1), var(--card-back-2));
    }

    .deck-card:nth-child(3)::before,
    .deck-card:nth-child(3)::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 2px solid rgba(255,255,255,0.22);
      border-radius: 14px;
    }

    .deck-card:nth-child(3)::after {
      inset: 32px 28px;
      border-style: dashed;
    }

    .deck-label {
      position: absolute;
      bottom: 18px;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      font-weight: 700;
    }

    .drawn-card-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.3s ease;
    }

    .drawn-card-wrap.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .card {
      position: relative;
      width: 230px;
      height: 300px;
      perspective: 1200px;
      cursor: pointer;
      transform: translateY(10px);
      transition: transform 0.35s ease, filter 0.35s ease;
    }

    .card:hover {
      transform: translateY(4px);
      filter: drop-shadow(0 18px 20px rgba(76, 87, 160, 0.18));
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(.22, 1, .36, 1);
    }

    .card.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 18px 30px rgba(40, 45, 86, 0.2);
    }

    .card-back {
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, #4d44d6, #2c1d7a);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .card-back::before,
    .card-back::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.18);
    }

    .card-back::after {
      inset: 30px 24px;
      border-style: dashed;
    }

    .card-back-mark {
      position: relative;
      z-index: 1;
      font-size: 3.3rem;
      opacity: 0.9;
    }

    .card-front {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 20px 18px;
      background: linear-gradient(160deg, #fffefe, #f3f5ff);
      transform: rotateY(180deg);
    }

    .card-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(109,94,246,0.15), transparent 40%);
      pointer-events: none;
    }

    .card-top {
      position: relative;
      z-index: 1;
      text-align: left;
    }

    .card-label {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--accent);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .message {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: -0.05em;
      color: var(--ink);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .card-footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .seal {
      font-size: 1.8rem;
      color: var(--accent);
      opacity: 0.8;
    }

    .controls {
      margin-top: 18px;
    }

    .draw-btn {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 24px var(--button-shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .draw-btn.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .draw-btn:hover,
    .draw-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px var(--button-shadow);
      outline: none;
    }

    @media (max-width: 520px) {
      .game {
        padding: 26px 18px 20px;
      }

      .table {
        height: 300px;
      }

      .deck-stack,
      .card {
        width: 210px;
        height: 270px;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Lucky Draw</h1>
    <p class="subtitle">Click the deck to draw a card</p>

    <div class="table">
      <div class="deck" id="deck" tabindex="0" role="button" aria-label="Draw a card from the deck">
        <div class="deck-stack" aria-hidden="true">
          <div class="deck-card"></div>
          <div class="deck-card"></div>
          <div class="deck-card"></div>
          <div class="deck-label">Mystery</div>
        </div>
      </div>

      <div class="drawn-card-wrap" id="drawnCardWrap" aria-live="polite">
        <div class="card" id="card" role="button" tabindex="0" aria-label="Reveal the hidden message">
          <div class="card-inner">
            <div class="card-face card-back">
              <span class="card-back-mark">✦</span>
            </div>
            <div class="card-face card-front">
              <div class="card-top">
                <span class="card-label">Fortune</span>
                <p class="message" id="message">You are amazing!</p>
              </div>
              <div class="card-footer">
                <span>Lucky</span>
                <span class="seal">✧</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="draw-btn" id="drawAgainBtn" type="button">Draw Another Card</button>
    </div>
  </main>

  <script>
    // Messages used when the card is revealed.
    const messages = [
      'You Nigga',
      'Gay as fuck',
      'mayabang si ramon',
      'Dick beater',
      'Pachupa daw si rheison',
      'si jian cock lover.'
    ];

    const deck = document.getElementById('deck');
    const card = document.getElementById('card');
    const drawnCardWrap = document.getElementById('drawnCardWrap');
    const message = document.getElementById('message');
    const drawAgainBtn = document.getElementById('drawAgainBtn');

    // Game state: idle -> drawn -> revealed
    let gameState = 'idle';

    // Choose a random message before revealing the card.
    function pickMessage() {
      const index = Math.floor(Math.random() * messages.length);
      return messages[index];
    }

    // Start the card draw animation.
    function drawCard() {
      if (gameState !== 'idle') return;

      deck.classList.add('is-drawn');
      drawnCardWrap.classList.add('visible');
      card.classList.remove('is-flipped');
      message.classList.remove('show');
      gameState = 'drawn';
    }

    // Reveal the front of the card with a flip animation.
    function revealCard() {
      if (gameState !== 'drawn') return;

      message.textContent = pickMessage();
      card.classList.add('is-flipped');
      gameState = 'revealed';

      window.setTimeout(() => {
        message.classList.add('show');
      }, 200);

      drawAgainBtn.classList.add('visible');
    }

    // Reset everything so the user can draw a new card.
    function resetDeck() {
      if (gameState === 'idle') return;

      gameState = 'idle';
      deck.classList.remove('is-drawn');
      drawnCardWrap.classList.remove('visible');
      card.classList.remove('is-flipped');
      message.classList.remove('show');
      drawAgainBtn.classList.remove('visible');
    }

    // Event listeners for the deck and the card.
    deck.addEventListener('click', () => {
      drawCard();
    });

    card.addEventListener('click', () => {
      revealCard();
    });

    drawAgainBtn.addEventListener('click', () => {
      resetDeck();
    });

    // Keyboard support for accessibility.
    deck.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        drawCard();
      }
    });

    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        revealCard();
      }
    });

    drawAgainBtn.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        resetDeck();
      }
    });
  </script>
</body>
</html>
